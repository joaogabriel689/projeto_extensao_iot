# ==============================================================================
# Eclipse Mosquitto 2.0 - Sistema Coutos Conveniência
# Arquitetura de Mensageria Resiliente com suporte a LWT e Retenção
# ==============================================================================

# Persistência local para retenção de estado e filas QoS 1/2
persistence true
persistence_location /mosquitto/data/

# Porta TCP padrão MQTT (ESP32, Backend Worker e Simulador)
listener 1883 0.0.0.0
allow_anonymous true

# Porta WebSockets (para futura Interface Web em tempo real)
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true

# Configurações de Log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
