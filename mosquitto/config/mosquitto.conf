# ==============================================================================
# Eclipse Mosquitto 2.0 - Sistema Coutos Conveniência (Hardened & Anti-DDoS)
# Arquitetura de Mensageria Resiliente com suporte a LWT, Retenção, Limites DoS
# e Autenticação Dinâmica (gerenciada por docker-entrypoint-auth.sh)
# ==============================================================================

# Persistência local para retenção de estado e filas QoS 1/2
persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db
autosave_interval 300

# Limites Globais de Segurança e Proteção contra Exaustão de Memória (DDoS)
max_inflight_messages 40
max_queued_messages 1000
max_queued_bytes 2097152
max_packet_size 16384
max_keepalive 300
set_tcp_nodelay true

# Porta TCP padrão MQTT (ESP32, Backend Worker e Simulador)
listener 1883 0.0.0.0
max_connections 50

# Porta WebSockets (restrita a 127.0.0.1 no docker-compose.yml)
listener 9001 0.0.0.0
protocol websockets
max_connections 20

# Configurações de Log
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
