# ==============================================================================
# NGINX REVERSE PROXY HARDENED, ANTI-DDOS & OPTIMIZED (NON-ROOT - UID 101)
# - Oculta versão do servidor (server_tokens off)
# - Proteção Anti-Slowloris e Anti-Socket-Exhaustion (timeouts curtos + RST)
# - Limite de conexões simultâneas por IP (limit_conn_zone: máx. 20 conexões/IP)
# - Rate Limiting em 4 camadas: Login, Escrita/Admin, API Geral e Páginas
# - Whitelist estrita de métodos HTTP (bloqueia TRACE, CONNECT, etc.)
# - Security Headers (CSP, Frame-Options, Nosniff, Referrer-Policy, COOP/CORP)
# - Bloqueia com 403 Forbidden qualquer acesso a arquivos sensíveis (.env, .git,
#   secrets.h, bancos .sqlite3/.db, scripts .py/.sql, binários internos)
# ==============================================================================

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Diretórios temporários em /tmp para execução 100% non-root e read-only rootfs
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # --------------------------------------------------------------------------
    # PROTEÇÃO ANTI-SLOWLORIS & EXAUSTÃO DE SOCKETS (DDoS Camada 7)
    # Encerra conexões lentas/travadas rapidamente e envia TCP RST imediato
    # --------------------------------------------------------------------------
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 30s;
    keepalive_requests 200;
    reset_timedout_connection on;

    # Limites de buffer de cabeçalho e corpo (mitiga ataques de Buffer Overflow / Large Header)
    client_body_buffer_size 64k;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;
    client_max_body_size 3M;

    # Compressão Gzip otimizada para reduzir banda e acelerar carregamento do painel
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # --------------------------------------------------------------------------
    # ZONAS DE PROTEÇÃO DDoS & RATE LIMITING POR IP
    # --------------------------------------------------------------------------
    # 1. Limite de conexões TCP simultâneas por IP
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_conn_status 429;

    # 2. Limite de requisições por segundo (4 camadas)
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=3r/s;
    limit_req_zone $binary_remote_addr zone=write_limit:10m rate=8r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=25r/s;
    limit_req_zone $binary_remote_addr zone=page_limit:10m rate=30r/s;
    limit_req_status 429;

    upstream backend_upstream {
        server backend:8000;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        # Aplica limite global de no máximo 20 conexões simultâneas por IP
        limit_conn conn_per_ip 20;

        # Whitelist estrita de métodos HTTP permitidos
        if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
            return 405;
        }

        # Cabeçalhos de Segurança HTTP (Defesa em Profundidade)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # 1. Bloqueio de arquivos ocultos (.env, .git, .gitignore, .htaccess)
        location ~ /\. {
            deny all;
            return 403 '{"detail":"Acesso bloqueado pelo Proxy de Seguranca (Arquivo Oculto)."}';
        }

        # 2. Bloqueio de extensões sensíveis de código, banco, chaves e configuração
        location ~* \.(env|git|sqlite|sqlite3|db|sql|py|pyc|ini|sh|yml|yaml|conf|h|ino|elf|map|key|pem|crt|log)$ {
            deny all;
            return 403 '{"detail":"Acesso bloqueado pelo Proxy de Seguranca (Extensao Restrita)."}';
        }

        # 3. Bloqueio de diretórios internos caso alguém tente adivinhar caminhos
        location ~* ^/(data|ota|postgres|mosquitto|firmware|scripts)(/|$) {
            deny all;
            return 403 '{"detail":"Acesso bloqueado pelo Proxy de Seguranca (Diretorio Interno)."}';
        }

        # 4. Rate Limiting estrito no endpoint de login do Painel
        location = /api/v1/auth/login {
            limit_req zone=login_limit burst=6 nodelay;
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5. Rate Limiting para rotas administrativas, usuários, configurações e OTA
        location ~* ^/api/v1/(users|audit-logs|settings|auth/change-password|devices/[^/]+/(ota|wifi|thresholds)) {
            limit_req zone=write_limit burst=15 nodelay;
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # 6. Rate Limiting geral para demais rotas da API
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # 7. Encaminhamento reverso para o Backend FastAPI (isolado na rede edge_proxy_net)
        location / {
            limit_req zone=page_limit burst=60 nodelay;
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}
