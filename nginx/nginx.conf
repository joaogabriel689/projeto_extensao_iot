# ==============================================================================
# NGINX REVERSE PROXY HARDENED (NON-ROOT - UID 101)
# - Oculta versão do servidor (server_tokens off)
# - Protege contra força bruta no /api/v1/auth/login (Rate Limiting)
# - Bloqueia com 403 Forbidden qualquer acesso a arquivos sensíveis (.env, .git,
#   secrets.h, bancos .sqlite3/.db, scripts .py/.sql, binários internos)
# ==============================================================================

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Diretórios temporários em /tmp para execução 100% non-root e read-only rootfs
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 3M;

    # Zona de Rate Limiting contra força bruta na senha do painel (5 tentativas/s com burst)
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;

    server {
        listen 8080;
        server_name _;

        # Cabeçalhos de Segurança
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 1. Bloqueio de arquivos ocultos (.env, .git, .gitignore, .htaccess)
        location ~ /\. {
            deny all;
            return 403 '{"detail":"Acesso bloqueado pelo Proxy de Seguranca (Arquivo Oculto)."}';
        }

        # 2. Bloqueio de extensões sensíveis de código, banco, chaves e configuração
        location ~* \.(env|git|sqlite|sqlite3|db|sql|py|pyc|ini|sh|yml|yaml|conf|h|ino|elf|map|key|pem|crt|log)$ {
            deny all;
            return 403 '{"detail":"Acesso bloqueado pelo Proxy de Seguranca (Extensao Restrita)."}';
        }

        # 3. Bloqueio de diretórios internos caso alguém tente adivinhar caminhos
        location ~* ^/(data|ota|postgres|mosquitto|firmware|scripts)(/|$) {
            deny all;
            return 403 '{"detail":"Acesso bloqueado pelo Proxy de Seguranca (Diretorio Interno)."}';
        }

        # 4. Rate Limiting específico no endpoint de login do Painel
        location = /api/v1/auth/login {
            limit_req zone=login_limit burst=10 nodelay;
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5. Encaminhamento reverso para o Backend FastAPI (isolado na rede interna)
        location / {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
