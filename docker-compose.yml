# ==============================================================================
# SISTEMA COUTOS CONVENIÊNCIA — DOCKER COMPOSE HARDENED, SEGREGADO & OTIMIZADO
# Dimensionado para VPS 4 da Contabo (4 vCPUs / 8 GB RAM):
# - Soma máxima de RAM dos contêineres: ~5.3 GB (~2.7 GB livres para SO/Cache)
# - Rotação automática de logs (máx. 30 MB por serviço) para proteger o SSD
# - Execução Non-Root, Read-Only RootFS, Cap-Drop ALL e No-New-Privileges
# - Micro-segmentação em 4 Redes Isoladas (Zero-Trust):
#     1. edge_proxy_net    : reverse_proxy <-> backend
#     2. mqtt_iot_net      : mosquitto <-> backend
#     3. whatsapp_net      : evolution_api <-> backend
#     4. data_internal_net : postgres + redis <-> backend + evolution_api
# ==============================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ----------------------------------------------------------------------------
  # 1. BROKER MQTT: Eclipse Mosquitto 2.0 (Non-Root UID 1883 + Auth Dinâmica)
  # Isolado exclusivamente na rede `mqtt_iot_net` (sem acesso a Postgres, Redis,
  # Evolution API ou Proxy Nginx).
  # ----------------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: coutos_mosquitto
    restart: unless-stopped
    user: "1883:1883"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:mode=1777,size=16m
    cpus: 0.50
    mem_limit: 256m
    mem_reservation: 64m
    pids_limit: 100
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/Campo_Grande}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-loja/freezer}
    entrypoint: ["/bin/sh", "/docker-entrypoint-auth.sh"]
    ports:
      - "${MQTT_HOST_PORT:-1884}:1883"
      - "127.0.0.1:${MQTT_WS_HOST_PORT:-9002}:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/config/docker-entrypoint-auth.sh:/docker-entrypoint-auth.sh:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -p 1883 -u \"$$MQTT_USERNAME\" -P \"$$MQTT_PASSWORD\" -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null 2>&1 || mosquitto_sub -p 1883 -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null 2>&1"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - mqtt_iot_net

  # ----------------------------------------------------------------------------
  # 2. BANCO DE DADOS RELACIONAL: PostgreSQL 16 (Non-Root UID 70 + Tuned 8GB VPS)
  # Isolado na rede `data_internal_net` (inacessível a partir do Nginx e do Mosquitto).
  # Porta de manutenção restrita a 127.0.0.1 no host.
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: coutos_postgres
    restart: unless-stopped
    user: "70:70"
    security_opt:
      - no-new-privileges:true
    shm_size: 256mb
    cpus: 1.00
    mem_limit: 1536m
    mem_reservation: 512m
    pids_limit: 200
    logging: *default-logging
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=384MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "synchronous_commit=local"
      - "-c"
      - "random_page_cost=1.1"
    environment:
      TZ: ${TZ:-America/Campo_Grande}
      POSTGRES_USER: ${POSTGRES_USER:-coutos_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque_esta_senha_segura_123}
      POSTGRES_DB: ${POSTGRES_DB:-coutos_telemetria}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init/01-init-evolution-db.sql:/docker-entrypoint-initdb.d/01-init-evolution-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coutos_admin} -d ${POSTGRES_DB:-coutos_telemetria}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - data_internal_net

  # ----------------------------------------------------------------------------
  # 3. CACHE E FILAS: Redis 7 (Non-Root UID 999, Isolado em data_internal_net)
  # Sem portas expostas no host e inacessível por Nginx ou Mosquitto.
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: coutos_redis
    restart: unless-stopped
    user: "999:999"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 0.50
    mem_limit: 512m
    mem_reservation: 128m
    pids_limit: 100
    logging: *default-logging
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--maxmemory",
        "384mb",
        "--maxmemory-policy",
        "allkeys-lru"
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - data_internal_net

  # ----------------------------------------------------------------------------
  # 4. GATEWAY WHATSAPP: Evolution API v2 (Node V8 Heap Limitado a 1.5GB)
  # Conectado apenas a `whatsapp_net` (comunicação com Backend) e `data_internal_net`
  # (acesso restrito ao evolution_db e Redis). Isolado do Nginx e do Mosquitto.
  # ----------------------------------------------------------------------------
  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: coutos_evolution_api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cpus: 1.00
    mem_limit: 2048m
    mem_reservation: 512m
    pids_limit: 300
    logging: *default-logging
    ports:
      - "127.0.0.1:${EVOLUTION_HOST_PORT:-8081}:8080"
    environment:
      TZ: ${TZ:-America/Campo_Grande}
      NODE_OPTIONS: "--max-old-space-size=1536"
      SERVER_URL: http://localhost:${EVOLUTION_HOST_PORT:-8081}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-troque_sua_evolution_global_api_key}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${EVOLUTION_DB_USER:-evolution_app_user}:${EVOLUTION_DB_PASSWORD:-troque_senha_app_evolution_123}@postgres:5432/${EVOLUTION_DB_NAME:-evolution_db}?schema=public
      DATABASE_CLIENT_NAME: coutos_evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      DEL_INSTANCE: "false"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - whatsapp_net
      - data_internal_net

  # ----------------------------------------------------------------------------
  # 5. BACKEND CENTRAL & WORKER MQTT RESILIENTE (Multi-Stage Non-Root UID 1000 + Read-Only)
  # Orquestrador central que conecta as 4 redes segregadas sem expor porta direta no host.
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coutos_backend
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 1.00
    mem_limit: 768m
    mem_reservation: 256m
    pids_limit: 150
    logging: *default-logging
    env_file:
      - .env
    environment:
      TZ: ${TZ:-America/Campo_Grande}
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      EVOLUTION_API_URL: http://evolution_api:8080
    expose:
      - "8000"
    volumes:
      - backend_buffer_data:/app/data
    depends_on:
      mosquitto:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edge_proxy_net
      - mqtt_iot_net
      - whatsapp_net
      - data_internal_net

  # ----------------------------------------------------------------------------
  # 6. PROXY REVERSO HARDENED & ANTI-DDOS: Nginx Unprivileged (UID 101 + Read-Only)
  # Isolado exclusivamente na rede `edge_proxy_net` (só enxerga `backend:8000`,
  # sem qualquer rota de rede para PostgreSQL, Redis, Mosquitto ou Evolution API).
  # ----------------------------------------------------------------------------
  reverse_proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: coutos_proxy
    restart: unless-stopped
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 0.50
    mem_limit: 256m
    mem_reservation: 64m
    pids_limit: 100
    logging: *default-logging
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - edge_proxy_net

volumes:
  mosquitto_data:
  mosquitto_log:
  postgres_data:
  redis_data:
  evolution_instances:
  backend_buffer_data:

# ------------------------------------------------------------------------------
# REDES SEGREGADAS (MICRO-SEGMENTAÇÃO ZERO-TRUST COM SUB-REDES /28 DEDICADAS)
# ------------------------------------------------------------------------------
networks:
  # Rede de Borda HTTP: Apenas Nginx Reverse Proxy <-> Backend FastAPI
  edge_proxy_net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br_coutos_edge
    ipam:
      config:
        - subnet: 10.240.1.0/28

  # Rede IoT MQTT: Apenas Broker Mosquitto <-> Backend Worker MQTT
  mqtt_iot_net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br_coutos_mqtt
    ipam:
      config:
        - subnet: 10.240.2.0/28

  # Rede Gateway WhatsApp: Apenas Evolution API <-> Backend FastAPI
  whatsapp_net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br_coutos_wa
    ipam:
      config:
        - subnet: 10.240.3.0/28

  # Rede Interna de Persistência e Cache: Apenas PostgreSQL + Redis <-> Backend + Evolution
  data_internal_net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br_coutos_data
    ipam:
      config:
        - subnet: 10.240.4.0/28
